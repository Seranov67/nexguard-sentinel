name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Foundry format and tests
        run: |
          docker run --rm \
            --volume "$PWD/contracts:/work" \
            --workdir /work \
            ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46 \
            "forge fmt --check && forge test -vvv"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: MyPy gateway simulator
        run: mypy services/gateway-simulator
      - name: MyPy controller
        run: mypy services/nexguard-controller
      - name: Tests without Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: pytest --tb=short
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Secret signatures
        run: |
          if grep -rIE "g""hp_|xo""xb-|AK""IA|bo""t[0-9]{8,}:" . \
            --exclude-dir=.git --exclude-dir=.venv; then
            echo "Secret signature found"
            exit 1
          fi

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and start healthy stack
        run: |
          chmod g+w data/backups data/gateway
          export DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          export NEXGUARD_DATA_GID="$(stat -c '%g' data/gateway)"
          docker compose up -d --build --wait --wait-timeout 120
      - name: Scenario A - stopped container recovers
        run: |
          export DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          export NEXGUARD_DATA_GID="$(stat -c '%g' data/gateway)"
          ./scripts/demo-stop.sh
          sleep 45
          ./scripts/verify-demo.sh
      - name: Scenario B - corrupt config recovers
        run: |
          export DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          export NEXGUARD_DATA_GID="$(stat -c '%g' data/gateway)"
          ./scripts/reset-demo.sh
          ./scripts/demo-corrupt-config.sh
          sleep 45
          ./scripts/verify-demo.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up Compose resources
        if: always()
        run: docker compose down -v
