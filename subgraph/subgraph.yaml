specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: DemoVault
    network: base-sepolia
    source:
      # Verified ES102 deployment; see docs/ethonline/deployments/base-sepolia.json.
      address: "0xF1683d32fEF59BBB95483561aBa62a1bdA65Cd13"
      abi: DemoVault
      startBlock: 46427865
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Withdrawal
      abis:
        - name: DemoVault
          file: ./abis/DemoVault.json
      eventHandlers:
        - event: Withdrawal(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdrawal
      file: ./src/demo-vault.ts
