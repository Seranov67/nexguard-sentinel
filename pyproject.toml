[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexguard"
version = "0.1.0"
description = "NexGuard Edge Resilience — IoT gateway supervisor (hackathon MVP)"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "pydantic>=2.10",
    "PyYAML>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "uvicorn>=0.32",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["services/gateway-simulator"]
testpaths = [
    "services/gateway-simulator/tests",
    "services/nexguard-controller/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "S101",    # use of assert (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["ANN", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["docker.*", "prometheus_client.*"]
ignore_missing_imports = true
