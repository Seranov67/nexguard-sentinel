name: nexguard

services:
  gateway-simulator:
    build:
      context: ./services/gateway-simulator
    container_name: gateway-simulator
    environment:
      GATEWAY_CONFIG_PATH: /data/gateway/gateway.yaml
      PORT: "8080"
    labels:
      io.nexguard.managed: "true"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./data/gateway:/data/gateway:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8080/health', timeout=3)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nexguard-controller:
    build:
      context: ./services/nexguard-controller
    container_name: nexguard-controller
    depends_on:
      gateway-simulator:
        condition: service_healthy
    environment:
      BACKUP_DIR: /data/backups
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-60}"
      BACKUP_RETENTION_COUNT: "${BACKUP_RETENTION_COUNT:-10}"
      CONFIG_PATH: /data/gateway/gateway.yaml
      FAILURE_THRESHOLD: "${FAILURE_THRESHOLD:-3}"
      GATEWAY_HEALTH_URL: http://gateway-simulator:8080/health
      HEALTH_CHECK_INTERVAL_SECONDS: "${HEALTH_CHECK_INTERVAL_SECONDS:-10}"
      MAX_RECOVERIES_PER_WINDOW: "${MAX_RECOVERIES_PER_WINDOW:-3}"
      NEXGUARD_ALLOWED_CONTAINERS: "${NEXGUARD_ALLOWED_CONTAINERS:-gateway-simulator}"
      RECOVERY_COOLDOWN_SECONDS: "${RECOVERY_COOLDOWN_SECONDS:-60}"
      RECOVERY_WINDOW_SECONDS: "${RECOVERY_WINDOW_SECONDS:-600}"
      RESTART_WAIT_SECONDS: "${RESTART_WAIT_SECONDS:-30}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    group_add:
      - "${DOCKER_GID:-0}"
      - "${NEXGUARD_DATA_GID:-1000}"
    ports:
      - "127.0.0.1:${METRICS_PORT:-8081}:8081"
    volumes:
      - ./data/backups:/data/backups
      - ./data/gateway:/data/gateway
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8081/health', timeout=3)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nexguard-prometheus
    depends_on:
      nexguard-controller:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nexguard-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-CHANGE_ME}"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  grafana-data:
  prometheus-data:
