global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: nexguard-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - nexguard-controller:8081

  - job_name: gateway-simulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway-simulator:8080
